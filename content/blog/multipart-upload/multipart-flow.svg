<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Multipart upload in four steps. 1: the client asks your backend to start an upload and gets an upload ID. 2: it asks for a presigned URL for each part. 3: it uploads each part straight to S3 and gets an ETag back. 4: it sends the list of ETags to your backend, which tells S3 to join the parts.">
  <!-- Shared diagram styles. Colors come from the site theme when the SVG is
       inlined in a post; the fallbacks are the dark theme. -->
  <style>
    .dg-sans { font-family: var(--font-archivo), Helvetica, Arial, sans-serif; }
    .dg-mono { font-family: var(--font-jetbrains), ui-monospace, Menlo, monospace; }
    .dg-fg { fill: var(--v2-fg, #f2f4f6); }
    .dg-mute { fill: var(--v2-mute, #a8b0b8); }
    .dg-dim { fill: var(--v2-dim, #7b848f); }
    .dg-accent { fill: var(--v2-accent, #60a5fa); }
    .dg-ok { fill: var(--v2-ok, #34d399); }
    .dg-rule { stroke: var(--v2-line, #23282e); }
    .dg-box { fill: var(--v2-panel, #101214); stroke: var(--v2-line, #23282e); }
    .dg-box-accent { fill: var(--v2-soft, #0e1b33); stroke: var(--v2-brand-bright, #3b82f6); }
    .dg-call { stroke: var(--v2-brand-bright, #3b82f6); stroke-width: 1.5; fill: none; }
    .dg-reply { stroke: var(--v2-dim, #7b848f); stroke-width: 1.2; stroke-dasharray: 5 4; fill: none; }
    .dg-loop { stroke: var(--v2-line, #23282e); stroke-dasharray: 4 4; fill: none; }
    .dg-head-call { fill: var(--v2-brand-bright, #3b82f6); }
    .dg-head-reply { fill: var(--v2-dim, #7b848f); }
    .dg-badge { fill: var(--v2-brand, #1d4ed8); }
  </style>
  <defs>
    <marker id="mpu-flow-call" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="dg-head-call"/>
    </marker>
    <marker id="mpu-flow-reply" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="dg-head-reply"/>
    </marker>
  </defs>

  <!-- Lanes -->
  <rect x="40" y="24" width="180" height="56" rx="10" class="dg-box"/>
  <text x="130" y="48" class="dg-sans dg-fg" font-size="15" font-weight="600" text-anchor="middle">Client</text>
  <text x="130" y="67" class="dg-mono dg-dim" font-size="11" text-anchor="middle">app or browser</text>

  <rect x="310" y="24" width="180" height="56" rx="10" class="dg-box-accent"/>
  <text x="400" y="48" class="dg-sans dg-fg" font-size="15" font-weight="600" text-anchor="middle">Your backend</text>
  <text x="400" y="67" class="dg-mono dg-dim" font-size="11" text-anchor="middle">hands out permission</text>

  <rect x="580" y="24" width="180" height="56" rx="10" class="dg-box"/>
  <text x="670" y="48" class="dg-sans dg-fg" font-size="15" font-weight="600" text-anchor="middle">S3</text>
  <text x="670" y="67" class="dg-mono dg-dim" font-size="11" text-anchor="middle">stores the parts</text>

  <line x1="130" y1="80" x2="130" y2="484" class="dg-rule" stroke-dasharray="2 4"/>
  <line x1="400" y1="80" x2="400" y2="484" class="dg-rule" stroke-dasharray="2 4"/>
  <line x1="670" y1="80" x2="670" y2="484" class="dg-rule" stroke-dasharray="2 4"/>

  <!-- 1. Start -->
  <circle cx="58" cy="129" r="12" class="dg-badge"/>
  <text x="58" y="133.5" class="dg-mono" font-size="12" fill="#ffffff" text-anchor="middle">1</text>
  <text x="265" y="110" class="dg-sans dg-fg" font-size="13.5" text-anchor="middle">Start an upload</text>
  <line x1="132" y1="118" x2="397" y2="118" class="dg-call" marker-end="url(#mpu-flow-call)"/>
  <line x1="398" y1="140" x2="133" y2="140" class="dg-reply" marker-end="url(#mpu-flow-reply)"/>
  <text x="265" y="157" class="dg-mono dg-mute" font-size="12" text-anchor="middle">upload ID</text>

  <!-- 2. Presigned URL -->
  <circle cx="58" cy="211" r="12" class="dg-badge"/>
  <text x="58" y="215.5" class="dg-mono" font-size="12" fill="#ffffff" text-anchor="middle">2</text>
  <text x="265" y="192" class="dg-sans dg-fg" font-size="13.5" text-anchor="middle">URL for part N, please</text>
  <line x1="132" y1="200" x2="397" y2="200" class="dg-call" marker-end="url(#mpu-flow-call)"/>
  <line x1="398" y1="222" x2="133" y2="222" class="dg-reply" marker-end="url(#mpu-flow-reply)"/>
  <text x="265" y="239" class="dg-mono dg-mute" font-size="12" text-anchor="middle">presigned URL</text>

  <!-- Steps 2-3 repeat for every part -->
  <rect x="96" y="174" width="608" height="164" rx="10" class="dg-loop"/>
  <circle cx="58" cy="297" r="12" class="dg-badge"/>
  <text x="58" y="301.5" class="dg-mono" font-size="12" fill="#ffffff" text-anchor="middle">3</text>
  <text x="535" y="278" class="dg-sans dg-fg" font-size="13.5" text-anchor="middle">PUT part N</text>
  <line x1="132" y1="286" x2="667" y2="286" class="dg-call" marker-end="url(#mpu-flow-call)"/>
  <line x1="668" y1="308" x2="133" y2="308" class="dg-reply" marker-end="url(#mpu-flow-reply)"/>
  <text x="535" y="325" class="dg-mono dg-mute" font-size="12" text-anchor="middle">ETag</text>
  <text x="696" y="352" class="dg-mono dg-dim" font-size="11" text-anchor="end">steps 2–3 repeat for every part</text>

  <!-- 4. Complete -->
  <circle cx="58" cy="419" r="12" class="dg-badge"/>
  <text x="58" y="423.5" class="dg-mono" font-size="12" fill="#ffffff" text-anchor="middle">4</text>
  <text x="265" y="400" class="dg-sans dg-fg" font-size="13.5" text-anchor="middle">Done. Here are the ETags</text>
  <line x1="132" y1="408" x2="397" y2="408" class="dg-call" marker-end="url(#mpu-flow-call)"/>
  <text x="535" y="422" class="dg-sans dg-fg" font-size="13.5" text-anchor="middle">Join the parts</text>
  <line x1="402" y1="430" x2="667" y2="430" class="dg-call" marker-end="url(#mpu-flow-call)"/>
  <line x1="398" y1="456" x2="133" y2="456" class="dg-reply" marker-end="url(#mpu-flow-reply)"/>
  <text x="265" y="473" class="dg-mono dg-ok" font-size="12" text-anchor="middle">file is ready</text>
</svg>
